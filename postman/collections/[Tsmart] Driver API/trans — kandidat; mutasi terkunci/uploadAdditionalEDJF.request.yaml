$kind: http-request
description: "KANDIDAT STATIS; belum dikonfirmasi sebagai route client atau verb. POST/form hanya hipotesis dari parser. Jangan jalankan sampai sandbox_host, izin, fixture sintetis dan rollback disetujui. Side effect: potensial DB/session/storage/integrasi; wajib driver_allow_mutation=YES. Field mandatory menurut source: appid, id_order. Jangan simpan token/PIN/data nyata dalam collection, environment export, history, atau dokumen."
url: "{{base_url}}/tunas/rental/trans/uploadAdditionalEDJF"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: appid
      value: "{{appid}}"
    - type: text
      key: ccode
      value: "{{ccode}}"
    - type: text
      key: id_driver
      value: "{{id_driver}}"
    - type: text
      key: lang
      value: "{{lang}}"
      disabled: true
    - type: text
      key: token
      value: "{{token}}"
    - type: text
      key: type
      value: "{{type}}"
      disabled: true
    - type: file
      key: file_name
      src:
        - ""
order: 43000
