$kind: http-request
description: "KANDIDAT STATIS; belum dikonfirmasi sebagai route client atau verb. POST/form hanya hipotesis dari parser. Jangan jalankan sampai sandbox_host, izin, fixture sintetis dan rollback disetujui. Side effect: potensial DB/session/storage/integrasi; wajib driver_allow_mutation=YES. Field mandatory menurut source: appid, id_driver, id_order, time. Jangan simpan token/PIN/data nyata dalam collection, environment export, history, atau dokumen."
url: "{{base_url}}/tunas/rental/trans/passout_auto"
method: POST
body:
  type: urlencoded
  content:
    - key: appid
      value: "{{appid}}"
    - key: ccode
      value: "{{ccode}}"
    - key: full_address
      value: "{{full_address}}"
    - key: id_driver
      value: "{{driver_id}}"
    - key: id_order
      value: "{{id_order}}"
    - key: km
      value: "{{km}}"
    - key: lang
      value: "{{lang}}"
      disabled: true
    - key: lattitude
      value: "{{lattitude}}"
    - key: location
      value: "{{location}}"
    - key: longitude
      value: "{{longitude}}"
    - key: time
      value: "{{time}}"
    - key: token
      value: "{{token}}"
    - key: waktu_jalan
      value: "{{waktu_jalan}}"
    - key: waktu_total
      value: "{{waktu_total}}"
    - key: waktu_tunggu
      value: "{{waktu_tunggu}}"
order: 21000
