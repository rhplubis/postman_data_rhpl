$kind: http-request
description: "KANDIDAT STATIS; belum dikonfirmasi sebagai route client atau verb. POST/form hanya hipotesis dari parser. Jangan jalankan sampai sandbox_host, izin, fixture sintetis dan rollback disetujui. Side effect: potensial DB/session/storage/integrasi; wajib driver_allow_mutation=YES. Field mandatory menurut source: appid, driver_id, enddate, startdate. Jangan simpan token/PIN/data nyata dalam collection, environment export, history, atau dokumen."
url: "{{base_url}}/tunas/rental/trans/getorderv3"
method: POST
body:
  type: urlencoded
  content:
    - key: appid
      value: "{{appid}}"
    - key: ccode
      value: "{{ccode}}"
    - key: driver_id
      value: "{{driver_id}}"
    - key: lang
      value: "{{lang}}"
      disabled: true
    - key: search
      value: "{{search}}"
      disabled: true
    - key: startdate
      value: "{{startdate}}"
    - key: token
      value: "{{token}}"
    - key: enddate
      value: "{{enddate}}"
order: 3000
