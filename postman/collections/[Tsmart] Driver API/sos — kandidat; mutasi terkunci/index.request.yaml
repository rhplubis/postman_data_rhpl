$kind: http-request
description: "KANDIDAT STATIS; belum dikonfirmasi sebagai route client atau verb. POST/form hanya hipotesis dari parser. Jangan jalankan sampai sandbox_host, izin, fixture sintetis dan rollback disetujui. Side effect: potensial DB/session/storage/integrasi; wajib driver_allow_mutation=YES. Field mandatory menurut source: appid, code, driver_id, msg, nopol, time. Jangan simpan token/PIN/data nyata dalam collection, environment export, history, atau dokumen."
url: "{{base_url}}/tunas/rental/sos/index"
method: POST
body:
  type: urlencoded
  content:
    - key: appid
      value: "{{appid}}"
    - key: ccode
      value: "{{ccode}}"
    - key: code
      value: "{{code}}"
    - key: driver_id
      value: "{{driver_id}}"
    - key: lang
      value: "{{lang}}"
      disabled: true
    - key: msg
      value: "{{msg}}"
    - key: nopol
      value: "{{nopol}}"
    - key: time
      value: "{{time}}"
    - key: token
      value: "{{token}}"
order: 1000
