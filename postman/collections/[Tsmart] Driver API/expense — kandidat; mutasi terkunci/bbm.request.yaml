      key: ccode
      value: "{{ccode}}"
    - type: text
      key: driver_id
      value: "{{driver_id}}"
    - type: text
      key: km_isi
      value: "{{km_isi}}"
    - type: text
      key: lang
      value: "{{lang}}"
      disabled: true
    - type: text
      key: lattitude
      value: "{{lattitude}}"
      disabled: true
    - type: text
      key: liter_isi
      value: "{{liter_isi}}"
    - type: text
      key: location
      value: "{{location}}"
      disabled: true
    - type: text
      key: longitude
      value: "{{longitude}}"
      disabled: true
    - type: text
      key: nama_spbu
      value: "{{nama_spbu}}"
    - type: text
      key: payment_tipe
      value: "{{payment_tipe}}"
      disabled: true
    - type: text
      key: rupiah
      value: "{{rupiah}}"
    - type: text
      key: time
      value: "{{time}}"
    - type: text
      key: token
      value: "{{token}}"
    - type: file
      key: file_name
      src:
        - ""
      disabled: true
order: 1000
