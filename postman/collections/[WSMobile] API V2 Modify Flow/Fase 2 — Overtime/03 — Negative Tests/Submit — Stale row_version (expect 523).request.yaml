$kind: http-request
url: "{{base_url}}/tunas/rental/wsovertime/Submit — Stale row_version (expect 523)"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    ccode: "{{ccode}}"
    appid: "{{appid}}"
    token: "{{worker_token}}"
    lang: id
    request_id: "{{request_id}}"
    overtime_uuid: "{{overtime_uuid}}"
    row_version: "0"
scripts:
  - type: beforeRequest
    code: "pm.variables.set('request_id', pm.variables.replaceIn('{{$guid}}')); "
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Response JSON', () => pm.response.to.be.json);
      const r=pm.response.json();
      pm.test('Has numeric code', () => pm.expect(r.code).to.be.a('number'));
      if (r.code !== 200) console.warn('API error', r.code, r.message);
      pm.test('Expected row conflict',()=>pm.expect(r.code).to.eql(523));
    language: text/javascript
order: 2000
