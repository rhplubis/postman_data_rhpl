$kind: http-request
url: "{{base_url}}/tunas/rental/wsovertime/getRequestDetail"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    ccode: "{{ccode}}"
    appid: "{{appid}}"
    token: "{{pic_token}}"
    lang: id
    overtime_uuid: "{{approval_overtime_uuid}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Response JSON', () => pm.response.to.be.json);
      const r=pm.response.json();
      pm.test('Has numeric code', () => pm.expect(r.code).to.be.a('number'));
      if (r.code !== 200) console.warn('API error', r.code, r.message);
    language: text/javascript
order: 2000
