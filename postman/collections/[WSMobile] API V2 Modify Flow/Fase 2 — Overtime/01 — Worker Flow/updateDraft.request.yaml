$kind: http-request
url: "{{base_url}}/tunas/rental/wsovertime/updateDraft"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: ccode
      value: "{{ccode}}"
    - type: text
      key: appid
      value: "{{appid}}"
    - type: text
      key: token
      value: "{{worker_token}}"
    - type: text
      key: lang
      value: id
    - type: text
      key: request_id
      value: "{{request_id}}"
    - type: text
      key: overtime_uuid
      value: "{{overtime_uuid}}"
    - type: text
      key: row_version
      value: "{{row_version}}"
    - type: text
      key: overtime_date
      value: "{{overtime_date}}"
    - type: text
      key: start_at
      value: "{{start_at}}"
    - type: text
      key: end_at
      value: "{{end_at}}"
    - type: text
      key: reason
      value: "{{reason}}"
    - type: text
      key: retained_attachment_ids[]
      value: "{{attachment_id}}"
      disabled: true
    - type: file
      key: attachments[]
      src:
        - ""
      disabled: true
scripts:
  - type: beforeRequest
    code: "pm.variables.set('request_id', pm.variables.replaceIn('{{$guid}}')); "
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Response JSON', () => pm.response.to.be.json);
      const r=pm.response.json();
      pm.test('Has numeric code', () => pm.expect(r.code).to.be.a('number'));
      if (r.code !== 200) console.warn('API error', r.code, r.message);
      if (r.code === 200 && r.data) {
        if (r.data.overtime_uuid) pm.collectionVariables.set('overtime_uuid', r.data.overtime_uuid);
        if (r.data.row_version !== undefined) pm.collectionVariables.set('row_version', String(r.data.row_version));
      }
    language: text/javascript
order: 5000
