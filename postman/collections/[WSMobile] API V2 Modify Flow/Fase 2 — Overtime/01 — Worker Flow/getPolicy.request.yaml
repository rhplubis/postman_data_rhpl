$kind: http-request
url: "{{base_url}}/tunas/rental/wsovertime/getPolicy"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    ccode: "{{ccode}}"
    appid: "{{appid}}"
    token: "{{worker_token}}"
    lang: id
scripts:
  - type: afterResponse
    code: |-
      pm.test('Response JSON', () => pm.response.to.be.json);
      const r=pm.response.json();
      pm.test('Has numeric code', () => pm.expect(r.code).to.be.a('number'));
      if (r.code !== 200) console.warn('API error', r.code, r.message);
      if (r.code===200) pm.test('Overtime enabled',()=>pm.expect(r.data.enabled).to.eql(true));
    language: text/javascript
order: 1000
