$kind: http-request
url: "{{base_url}}/tunas/rental/wsattendance/getAttendanceDetail"
method: POST
headers:
  - key: X-Request-ID
    value: "{{$guid}}"
    description: "Phase 01 correlation ID. Write endpoint: must equal body request_id."
body:
  type: urlencoded
  content:
    ccode: "{{ccode}}"
    appid: "{{appid}}"
    token: "{{token}}"
    attendance_key: INVALID
scripts:
  - type: afterResponse
    code: pm.test('failure code',()=>pm.expect(pm.response.json().code).not.eql(200));
    language: text/javascript
order: 5000
