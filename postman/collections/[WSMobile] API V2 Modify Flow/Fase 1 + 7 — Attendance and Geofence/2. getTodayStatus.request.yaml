$kind: http-request
url: "{{base_url}}/tunas/rental/wsattendance/getTodayStatus"
method: POST
headers:
  - key: X-Request-ID
    value: "{{$guid}}"
    description: "Phase 01 correlation ID. Write endpoint: must equal body request_id."
body:
  type: urlencoded
  content:
    ccode: "{{ccode}}"
    appid: "{{appid}}"
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      const j=pm.response.json(); pm.test('code 200',()=>pm.expect(j.code).to.eql(200));
      pm.test('today state',()=>pm.expect(j.data.attendance).to.have.property('state'));
    language: text/javascript
order: 2000
