$kind: http-request
url: "{{base_url}}?uri=tunas/rental/wsdashboard/getDashboardSummary"
method: POST
headers:
  X-Request-ID: "{{$guid}}"
queryParams:
  uri: tunas/rental/wsdashboard/getDashboardSummary
body:
  type: urlencoded
  content:
    ccode: "{{ccode}}"
    appid: "{{appid}}"
    token: "{{pic_token}}"
    business_date: "{{business_date}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200',()=>pm.response.to.have.status(200));
      pm.test('No raw sensitive fields',()=>{const t=pm.response.text();['latitude','longitude','photo_url','object_url'].forEach(k=>pm.expect(t.toLowerCase()).not.to.include(k));});
    language: text/javascript
order: 1000
