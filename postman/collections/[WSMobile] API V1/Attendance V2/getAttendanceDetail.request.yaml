$kind: http-request
url: "{{base_url}}/tunas/rental/ws_attendance/getAttendanceDetail"
method: POST
body:
  type: urlencoded
  content:
    ccode: "{{ccode}}"
    appid: "{{appid}}"
    token: "{{token}}"
    attendance_key: "{{attendance_key}}"
scripts:
  - type: afterResponse
    code: |-
      const j=pm.response.json(); pm.test('code 200',()=>pm.expect(j.code).to.eql(200));
      pm.test('matching key',()=>pm.expect(j.data.attendance_key).to.eql(pm.collectionVariables.get('attendance_key')));
    language: text/javascript
order: 4000
